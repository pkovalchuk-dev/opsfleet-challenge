<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1092" viewBox="0 0 1100 1092" role="img" aria-labelledby="title desc">
<title id="title">Main graph</title><desc id="desc">plan_and_route (LLM), then start_step (Python) dispatches one action to analyze (subgraph A), read_context (LLM), manage_reports (subgraph B) or safe_reply (Python, including preference acknowledgements); each returns through output_check (Python) to complete_step (Python), which loops to start_step for the next action or goes to finish_plan (Python), learn_after_turn (subgraph C) and END.</desc>
